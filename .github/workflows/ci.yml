name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:
    inputs:
      benchmark_base:
        description: 'Optional base commit for a same-runner Windows comparison'
        type: string
        default: ''

jobs:
  build-test-windows:
    name: Build & Test (Windows)
    runs-on: windows-2022

    strategy:
      fail-fast: false
      matrix:
        preset: [mingw-combined, mingw-static, mingw-shared, mingw-strict, mingw-strict-shared, mingw-synchronized, mingw-synchronized-shared]

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            make

      - name: Configure CMake
        shell: msys2 {0}
        run: |
          set -e
          cmake --version
          bash scripts/run-logged.sh cmake-config.log cmake --preset ${{ matrix.preset }}

      - name: Build
        shell: msys2 {0}
        run: |
          bash scripts/run-logged.sh build.log cmake --build build/presets/${{ matrix.preset }} --parallel

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: build-logs-windows-${{ matrix.preset }}
          path: |
            cmake-config.log
            build.log
          retention-days: 7

      - name: Run Tests
        shell: msys2 {0}
        run: |
          ctest --preset ${{ matrix.preset }} --output-on-failure

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-windows-${{ matrix.preset }}
          path: |
            build/presets/${{ matrix.preset }}/Testing/
            build/presets/${{ matrix.preset }}/**/*.log
          retention-days: 7

  build-test-linux:
    name: Build & Test (Linux)
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        preset: [posix-release, posix-asan-ubsan, posix-pwait2-fallback]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install CMake 3.21+
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '3.21.x'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ninja-build

      - name: Configure CMake
        run: |
          cmake --preset ${{ matrix.preset }}

      - name: Build
        run: |
          bash scripts/run-logged.sh build.log cmake --build build/presets/${{ matrix.preset }} --parallel

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: build-logs-linux-${{ matrix.preset }}
          path: |
            build.log
          retention-days: 7

      - name: Run Tests
        run: |
          ctest --preset ${{ matrix.preset }} --output-on-failure

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-linux-${{ matrix.preset }}
          path: |
            build/presets/${{ matrix.preset }}/Testing/
            build/presets/${{ matrix.preset }}/**/*.log
          retention-days: 7

  benchmark-windows:
    name: Benchmark (Windows)
    runs-on: windows-2022
    needs: build-test-windows

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            make

      - name: Configure CMake (Release)
        shell: msys2 {0}
        run: |
          cmake --preset mingw-combined

      - name: Build
        shell: msys2 {0}
        run: |
          cmake --build build/presets/mingw-combined --parallel

      - name: Run Benchmarks
        shell: msys2 {0}
        run: |
          set -e
          bench_dir=build/presets/mingw-combined/bench
          bash scripts/run-logged.sh "$bench_dir/bench_windows_results.txt" "$bench_dir/bench_windows.exe"
          bash scripts/run-logged.sh "$bench_dir/bench_mt_contention_results.txt" "$bench_dir/bench_mt_contention.exe"

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-results-windows
          path: |
            build/presets/mingw-combined/bench/*.txt
            build/presets/mingw-combined/bench/*.log
          retention-days: 30

  benchmark-linux:
    name: Benchmark (Linux)
    runs-on: ubuntu-latest
    needs: build-test-linux

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build

      - name: Configure CMake (Release)
        run: |
          cmake --preset posix-release

      - name: Build
        run: |
          cmake --build build/presets/posix-release --parallel

      - name: Run Benchmarks
        run: |
          set -e
          bench_dir=build/presets/posix-release/bench
          bash scripts/run-logged.sh "$bench_dir/bench_wait_scaling_results.txt" "$bench_dir/bench_wait_scaling"
          bash scripts/run-logged.sh "$bench_dir/bench_latency_results.txt" "$bench_dir/bench_latency"

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-results-linux
          path: |
            build/presets/posix-release/bench/*.txt
            build/presets/posix-release/bench/*.log
          retention-days: 30

  compare-windows:
    name: Paired Benchmark (Windows)
    if: github.event_name == 'workflow_dispatch' && inputs.benchmark_base != ''
    needs: build-test-windows
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-python
            git
            make
      - name: Build and compare
        shell: msys2 {0}
        env:
          BENCHMARK_BASE: ${{ inputs.benchmark_base }}
        run: |
          set -euo pipefail
          base_sha=$(git rev-parse --verify --end-of-options "$BENCHMARK_BASE^{commit}")
          candidate_sha=$(git rev-parse HEAD)
          compare_root=$(mktemp -d)
          git worktree add --detach "$compare_root/base" "$base_sha"
          mkdir -p benchmark-comparison
          gcc --version
          for variant in base candidate; do
            source_dir=$PWD
            if [ "$variant" = base ]; then source_dir="$compare_root/base"; fi
            bash scripts/run-logged.sh "benchmark-comparison/$variant-configure.log" \
              cmake --preset mingw-combined -S "$source_dir" -B "$compare_root/$variant-build"
            bash scripts/run-logged.sh "benchmark-comparison/$variant-build.log" \
              cmake --build "$compare_root/$variant-build" --parallel 4 --target bench_windows bench_mt_contention
          done
          python -B scripts/compare-windows-bench.py \
            --base-dir "$compare_root/base-build/bench" \
            --candidate-dir "$compare_root/candidate-build/bench" \
            --base-sha "$base_sha" --candidate-sha "$candidate_sha" \
            --output benchmark-comparison
      - name: Upload comparison evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-paired-comparison
          path: benchmark-comparison/
          retention-days: 30
